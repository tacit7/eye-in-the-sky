<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}} - Eye in the Sky</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/css/output.css" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col">
    <nav class="navbar">
        <div class="bg-primary-800 text-white px-6 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="bi bi-eye text-2xl text-primary-200"></i>
                <h1 class="font-semibold tracking-wide text-xl">Eye in the Sky</h1>
            </div>
            <div class="text-primary-200 text-sm font-medium">
                Claude Code Multi-Agent Dashboard
            </div>
        </div>
    </nav>

    <main class="flex-1">
        <div class="max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
            {{template "content" .}}
        </div>
    </main>

    <footer class="bg-surface border-t border-gray-700 py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-gray-400">
            <small>Claude Code Multi-Agent Management System</small>
        </div>
    </footer>

    <script src="/static/js/dashboard.js"></script>
</body>
</html>
